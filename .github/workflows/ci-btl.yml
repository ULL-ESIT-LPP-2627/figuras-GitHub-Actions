name: CI BTL

on:
  push:
    branches: [btl]
  pull_request:
    branches: [btl]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Instalar dependencias
        run: gem install rake test-unit simplecov

      - name: Ejecutar pruebas de TL
        run: rake
        working-directory: TL
