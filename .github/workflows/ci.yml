name: CI

on:
  push:
    branches: [main, btl, btdd]
  pull_request:
    branches: [main, btl, btdd]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "jruby"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: gem install rake rspec simplecov 
      - run: cd TL; rake 
      - run: cd TDD; rake 
