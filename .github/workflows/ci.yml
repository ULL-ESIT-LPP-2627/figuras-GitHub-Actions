name: CI

on:
  push:
    branches: [btl, tdd]
  pull_request:
    branches: [btl, tdd]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rake rspec  
      - run: rake -f TL/Rakefile
      - run: rake -f TDD/Rakefile
