name: CI

on:
  push:
    branches: [main, btl, tdd]
  pull_request:
    branches: [main, btl, tdd]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rake rspec simplecov 
      - run: cd TL; rake 
      - run: cd TDD; rake 
